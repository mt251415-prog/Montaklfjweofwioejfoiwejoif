<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCTS 보물찾기 시뮬레이터</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* CSS Tree Layout - 부모와 자식을 연결하는 선 그리기 */
        .tree ul {
            padding-top: 20px; position: relative;
            transition: all 0.5s;
            display: flex; justify-content: center;
        }
        .tree li {
            float: left; text-align: center;
            list-style-type: none;
            position: relative;
            padding: 20px 10px 0 10px;
            transition: all 0.5s;
        }
        /* Connectors */
        .tree li::before, .tree li::after{
            content: ''; position: absolute; top: 0; right: 50%;
            border-top: 2px solid #cbd5e1; width: 50%; height: 20px;
            transition: all 0.5s;
        }
        .tree li::after{
            right: auto; left: 50%;
            border-left: 2px solid #cbd5e1;
        }
        /* Remove connectors for single items or root */
        .tree li:only-child::after, .tree li:only-child::before {
            display: none;
        }
        .tree li:only-child{ padding-top: 0;}
        /* Remove left/right connectors for first/last children */
        .tree li:first-child::before, .tree li:last-child::after{
            border: 0 none;
        }
        /* Add rounded corners */
        .tree li:last-child::before{
            border-right: 2px solid #cbd5e1;
            border-radius: 0 5px 0 0;
        }
        .tree li:first-child::after{
            border-radius: 5px 0 0 0;
        }
        /* Downward line from parent */
        .tree ul ul::before{
            content: ''; position: absolute; top: 0; left: 50%;
            border-left: 2px solid #cbd5e1;
            width: 0; height: 20px;
        }
        
        /* Custom Animations */
        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop 0.4s ease-out forwards; }
        
        @keyframes flash-green {
            0%, 100% { background-color: white; }
            50% { background-color: #bbf7d0; }
        }
        .animate-flash-win { animation: flash-green 1s ease-out; }
        
        @keyframes flash-red {
            0%, 100% { background-color: white; }
            50% { background-color: #fecaca; }
        }
        .animate-flash-lose { animation: flash-red 1s ease-out; }

        body { font-family: 'Inter', -apple-system, sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="w-full min-h-screen text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // UCB1 계산 함수
        const C_PARAM = 1.414; // 탐색 상수
        const calculateUCB1 = (nodeVisits, nodeWins, parentVisits) => {
            if (nodeVisits === 0) return { ucb: Infinity, exploit: 0, explore: Infinity };
            const exploit = nodeWins / nodeVisits; // 승률 (활용)
            const explore = C_PARAM * Math.sqrt(Math.log(parentVisits) / nodeVisits); // 가산점 (탐색)
            return { ucb: exploit + explore, exploit, explore };
        };

        // 단계(Phase) 메타데이터
        const PHASE_INFO = {
            IDLE: { title: "대기 중", icon: "💤", desc: "시뮬레이션을 시작하세요!" },
            SELECTION: { title: "1. 선택 (Selection)", icon: "👣", desc: "가장 매력적인 방(UCB 점수가 높은 곳)을 찾아 끝까지 내려갑니다.", color: "text-blue-600", bg: "bg-blue-100" },
            EXPANSION: { title: "2. 확장 (Expansion)", icon: "🚪", desc: "도착한 곳에서 아직 안 가본 새로운 방의 문을 새로 엽니다.", color: "text-amber-600", bg: "bg-amber-100" },
            SIMULATION: { title: "3. 시뮬레이션 (Simulation)", icon: "🎲", desc: "새로운 방에서 끝까지 빠르게 가상 탐험을 진행하여 보물 유무를 확인합니다.", color: "text-purple-600", bg: "bg-purple-100" },
            BACKPROPAGATION: { title: "4. 역전파 (Backpropagation)", icon: "📣", desc: "결과(승/패)를 방금 지나온 모든 방의 표지판에 기록하며 위로 돌아갑니다.", color: "text-emerald-600", bg: "bg-emerald-100" },
        };

        // 초기 트리 상태
        const getInitialState = () => ({
            tree: [{ id: 0, parent: null, n: 0, w: 0 }],
            phase: 'IDLE',
            path: [], // 현재 거쳐간 노드 ID 배열
            currentNodeId: 0,
            simulationResult: null, // true(win), false(lose)
            log: "AI 탐험가가 던전 입구에 서 있습니다.",
            stepCount: 0
        });

        const Simulator = () => {
            const [state, setState] = useState(getInitialState());
            const [autoPlay, setAutoPlay] = useState(false);
            const [speed, setSpeed] = useState(1000);
            const [showGuide, setShowGuide] = useState(false);

            // 핵심 MCTS 스텝 진행 로직
            const nextStep = () => {
                setState(prevState => {
                    let { tree, phase, path, currentNodeId, simulationResult, stepCount } = prevState;
                    let newTree = JSON.parse(JSON.stringify(tree)); // Deep copy
                    let newPath = [...path];
                    
                    if (phase === 'IDLE' || phase === 'BACKPROPAGATION') {
                        // === 1. SELECTION (선택) ===
                        let current = newTree[0];
                        newPath = [current.id];
                        const MAX_CHILDREN = 2; // 각 노드의 최대 자식 수

                        while (true) {
                            let children = newTree.filter(n => n.parent === current.id);
                            
                            // 자식이 다 만들어지지 않은 노드면 탐색 멈춤
                            if (children.length < MAX_CHILDREN) {
                                break;
                            }
                            // 자식이 다 있다면 UCB1 점수가 가장 높은 곳으로 이동
                            let bestChild = null;
                            let maxUcb = -Infinity;
                            
                            for (let child of children) {
                                const { ucb } = calculateUCB1(child.n, child.w, current.n);
                                if (ucb > maxUcb) { maxUcb = ucb; bestChild = child; }
                            }
                            
                            if(bestChild) {
                                current = bestChild;
                                newPath.push(current.id);
                            } else {
                                break;
                            }
                        }
                        return { ...prevState, phase: 'SELECTION', path: newPath, currentNodeId: current.id, log: "👣 [선택] 승률과 호기심을 계산하여 가장 매력적인 방을 선택했습니다." };
                    } 
                    else if (phase === 'SELECTION') {
                        // === 2. EXPANSION (확장) ===
                        const newId = newTree.length;
                        const newNode = { id: newId, parent: currentNodeId, n: 0, w: 0 };
                        newTree.push(newNode);
                        newPath.push(newId);
                        return { ...prevState, tree: newTree, phase: 'EXPANSION', path: newPath, currentNodeId: newId, log: "🚪 [확장] 탐험하지 않은 새로운 길(노드)을 발견하여 개척했습니다." };
                    }
                    else if (phase === 'EXPANSION') {
                        // === 3. SIMULATION (시뮬레이션) ===
                        const isWin = Math.random() > 0.5;
                        const resultMsg = isWin ? "💎 보물 발견! (성공)" : "💀 텅 빈 방 (실패)";
                        return { ...prevState, phase: 'SIMULATION', simulationResult: isWin, log: `🎲 [시뮬레이션] 뇌를 비우고 빠르게 가상 탐험을 진행한 결과: ${resultMsg}` };
                    }
                    else if (phase === 'SIMULATION') {
                        // === 4. BACKPROPAGATION (역전파) ===
                        for (let id of newPath) {
                            let nodeIndex = newTree.findIndex(n => n.id === id);
                            newTree[nodeIndex].n += 1;
                            if (simulationResult) {
                                newTree[nodeIndex].w += 1;
                            }
                        }
                        return { ...prevState, tree: newTree, phase: 'BACKPROPAGATION', stepCount: stepCount + 1, log: "📣 [역전파] 탐험 결과를 지나온 모든 방의 표지판에 업데이트했습니다!" };
                    }
                    return prevState;
                });
            };

            // 자동 실행 타이머
            useEffect(() => {
                let interval;
                if (autoPlay) {
                    interval = setInterval(() => {
                        nextStep();
                    }, speed);
                }
                return () => clearInterval(interval);
            }, [autoPlay, speed]);

            const handleReset = () => {
                setAutoPlay(false);
                setState(getInitialState());
            };

            // 재귀적으로 트리를 렌더링하는 컴포넌트
            const renderTree = (nodeId) => {
                const node = state.tree.find(n => n.id === nodeId);
                if(!node) return null;
                const children = state.tree.filter(n => n.parent === nodeId);
                
                // 상태별 스타일 지정
                const isCurrent = state.currentNodeId === node.id;
                const inPath = state.path.includes(node.id);
                const isNewlyExpanded = state.phase === 'EXPANSION' && isCurrent;
                const isSimulating = state.phase === 'SIMULATION' && isCurrent;
                const isPropagating = state.phase === 'BACKPROPAGATION' && inPath;

                let borderClass = "border-slate-300";
                let bgClass = "bg-white";
                let shadowClass = "shadow-sm";
                
                if (inPath && state.phase === 'SELECTION') { borderClass = "border-blue-500 border-2"; shadowClass = "shadow-blue-200 shadow-lg"; }
                if (isNewlyExpanded) { borderClass = "border-amber-500 border-2"; bgClass="bg-amber-50"; shadowClass = "shadow-amber-200 shadow-lg"; }
                if (isSimulating) { borderClass = "border-purple-500 border-2"; bgClass="bg-purple-50"; shadowClass = "shadow-purple-200 shadow-lg"; }
                if (isPropagating) { 
                    borderClass = "border-emerald-500 border-2"; 
                    bgClass = state.simulationResult ? "animate-flash-win" : "animate-flash-lose"; 
                }

                return (
                    <li key={node.id}>
                        <div className={`relative flex flex-col items-center justify-center p-3 w-28 rounded-xl border transition-all duration-300 ${borderClass} ${bgClass} ${shadowClass} ${isNewlyExpanded ? 'animate-pop' : ''}`}>
                            {/* 노드 아이콘 */}
                            <div className="text-xl mb-1">
                                {node.id === 0 ? "🏰" : "🚪"}
                            </div>
                            {/* N (방문), W (승리) 스탯 */}
                            <div className="text-sm font-bold text-slate-700 flex flex-col gap-1 w-full">
                                <div className="flex justify-between items-center bg-slate-100 rounded px-2 py-0.5">
                                    <span className="text-slate-500 text-xs">탐험(N)</span>
                                    <span>{node.n}</span>
                                </div>
                                <div className="flex justify-between items-center bg-emerald-50 rounded px-2 py-0.5">
                                    <span className="text-emerald-600 text-xs">보물(W)</span>
                                    <span>{node.w}</span>
                                </div>
                            </div>
                            
                            {/* 시뮬레이션 결과 팝업 */}
                            {isSimulating && (
                                <div className="absolute -top-10 text-2xl animate-bounce">
                                    {state.simulationResult ? "💎" : "💀"}
                                </div>
                            )}
                        </div>
                        {/* 자식 노드 재귀 호출 */}
                        {children.length > 0 && (
                            <ul>{children.map(child => renderTree(child.id))}</ul>
                        )}
                    </li>
                );
            };

            // UCB1 현황판 렌더링용
            const renderUcbPanel = () => {
                if (state.phase === 'IDLE') return <div className="text-slate-500 text-sm">탐험을 시작하면 AI의 고민 과정과 수학적 수식이 여기에 표시됩니다.</div>;
                
                const targetNodeId = state.phase === 'SELECTION' || state.phase === 'EXPANSION' ? state.path[state.path.length-2] ?? 0 : state.path[state.path.length-1] ?? 0;
                const parentNode = state.tree.find(n => n.id === targetNodeId);
                if(!parentNode) return null;

                const children = state.tree.filter(n => n.parent === parentNode.id);
                
                if (children.length === 0) return <div className="text-slate-500 text-sm">아직 이 방에서는 다른 갈림길을 발견하지 못했어요.</div>;

                return (
                    <div className="space-y-4">
                        {/* UCB1 수식 가이드 박스 */}
                        <div className="bg-slate-900 text-slate-100 p-3 rounded-xl text-xs space-y-1.5 shadow-md">
                            <div className="text-amber-400 font-bold flex justify-between items-center">
                                <span>📐 UCB1 표준 수식</span>
                                <span className="text-[10px] bg-slate-800 px-1.5 py-0.5 rounded text-slate-300">c ≈ 1.414</span>
                            </div>
                            <div className="font-mono text-center py-1 text-sm bg-slate-800 rounded border border-slate-700 text-emerald-300">
                                UCB1 = <span className="text-blue-300">w_i / n_i</span> + c × <span className="text-amber-300 font-bold">√( ln(N) / n_i )</span>
                            </div>
                            <div className="flex justify-between text-[11px] text-slate-400 pt-0.5 border-t border-slate-800">
                                <span>N(부모 탐험): <b className="text-white">{parentNode.n}</b></span>
                                <span>ln(N): <b className="text-white">{parentNode.n > 0 ? Math.log(parentNode.n).toFixed(2) : 0}</b></span>
                            </div>
                        </div>

                        {/* 각 자식 노드별 수식 대입 및 계산 결과 */}
                        {children.map(child => {
                            const { ucb, exploit, explore } = calculateUCB1(child.n, child.w, parentNode.n);
                            const isInfinite = ucb === Infinity;
                            const isSelected = state.path.includes(child.id);
                            
                            return (
                                <div key={child.id} className={`p-3 rounded-xl border transition-all ${isSelected ? 'border-blue-500 bg-blue-50/70 shadow-sm ring-2 ring-blue-200' : 'border-slate-200 bg-white'}`}>
                                    <div className="flex justify-between items-center mb-2">
                                        <span className="font-bold text-slate-800 text-xs flex items-center gap-1">
                                            🚪 노드 #{child.id} 
                                            {isSelected && <span className="bg-blue-600 text-white text-[10px] px-1.5 py-0.2 rounded-full font-normal">선택됨</span>}
                                        </span>
                                        <span className="font-mono font-bold text-sm text-blue-600">
                                            {isInfinite ? '∞ (최우선)' : ucb.toFixed(3)}
                                        </span>
                                    </div>

                                    {isInfinite ? (
                                        <div className="text-xs bg-amber-50 border border-amber-200 text-amber-800 p-2 rounded-lg font-medium">
                                            n_i = 0 이므로 분모가 0이 되어 탐색 가산점 → <b className="text-amber-600">무한대(∞)</b>!
                                        </div>
                                    ) : (
                                        <div className="space-y-2 text-xs">
                                            <div className="font-mono bg-slate-100 p-2 rounded text-[11px] text-slate-700 leading-relaxed overflow-x-auto">
                                                <div>= ({child.w}/{child.n}) + 1.414 × √( {Math.log(parentNode.n).toFixed(2)} / {child.n} )</div>
                                                <div className="text-slate-500 text-[10px] mt-0.5">
                                                    = <span className="text-emerald-700 font-bold">{exploit.toFixed(3)} (활용)</span> + <span className="text-amber-700 font-bold">{explore.toFixed(3)} (탐색)</span>
                                                </div>
                                            </div>

                                            <div className="space-y-1">
                                                <div className="flex justify-between text-[10px] text-slate-500">
                                                    <span>활용(승률): {(exploit * 100).toFixed(0)}%</span>
                                                    <span>가산점: +{explore.toFixed(2)}</span>
                                                </div>
                                                <div className="h-2 w-full bg-slate-100 rounded-full overflow-hidden flex">
                                                    <div className="bg-emerald-500 h-full transition-all" style={{ width: `${Math.min(100, (exploit / (ucb || 1)) * 100)}%` }}></div>
                                                    <div className="bg-amber-400 h-full transition-all" style={{ width: `${Math.min(100, (explore / (ucb || 1)) * 100)}%` }}></div>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                );
            };

            const currentPhaseInfo = PHASE_INFO[state.phase];

            return (
                <div className="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
                    {/* 상단 헤더 */}
                    <header className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h1 className="text-2xl font-black text-slate-900 flex items-center gap-2">
                                🎲 MCTS 보물찾기 시뮬레이터
                            </h1>
                            <p className="text-sm text-slate-500 mt-1">
                                몬테카를로 트리 탐색(MCTS)의 4단계 원리와 UCB1 공식을 실시간 시각화로 이해해 보세요.
                            </p>
                        </div>
                        <div className="flex items-center gap-2">
                            <button
                                onClick={() => setShowGuide(true)}
                                className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition text-sm flex items-center gap-1.5"
                            >
                                📖 사용 방법 & 가이드
                            </button>
                            <span className="bg-blue-50 text-blue-700 font-semibold px-3 py-1 rounded-full text-xs border border-blue-200">
                                총 탐험 회수: {state.stepCount}회
                            </span>
                        </div>
                    </header>

                    {/* 메인 콘텐츠 영역 */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* 좌측 2컬럼: 트리 시각화 영역 */}
                        <div className="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center min-h-[500px] overflow-x-auto relative">
                            <div className="absolute top-4 left-4 text-xs font-bold text-slate-400 uppercase tracking-wider">
                                🏰 던전 지형도 (Tree View)
                            </div>
                            
                            <div className="tree my-auto w-full flex justify-center">
                                <ul>
                                    {renderTree(0)}
                                </ul>
                            </div>
                        </div>

                        {/* 우측 1컬럼: 제어판 및 정보 모니터링 */}
                        <div className="space-y-4">
                            {/* 제어 컨트롤러 */}
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                                <h2 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                                    ⚙️ 컨트롤러
                                </h2>
                                <div className="grid grid-cols-2 gap-2">
                                    <button
                                        onClick={nextStep}
                                        disabled={autoPlay}
                                        className="col-span-1 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white font-bold py-2.5 px-4 rounded-xl transition text-sm flex items-center justify-center gap-1 shadow-md shadow-blue-100"
                                    >
                                        ▶ 1단계씩 실행
                                    </button>
                                    <button
                                        onClick={() => setAutoPlay(!autoPlay)}
                                        className={`col-span-1 font-bold py-2.5 px-4 rounded-xl transition text-sm flex items-center justify-center gap-1 shadow-md ${autoPlay ? 'bg-amber-500 hover:bg-amber-600 text-white shadow-amber-100' : 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-emerald-100'}`}
                                    >
                                        {autoPlay ? "⏸️ 일시정지" : "⏩ 자동 탐험"}
                                    </button>
                                </div>
                                <div className="flex items-center justify-between gap-2 pt-2 border-t border-slate-100">
                                    <div className="flex items-center gap-2">
                                        <span className="text-xs text-slate-500 font-medium">속도:</span>
                                        <select 
                                            value={speed} 
                                            onChange={(e) => setSpeed(Number(e.target.value))}
                                            className="text-xs bg-slate-100 border-none rounded-lg px-2 py-1 font-medium text-slate-700"
                                        >
                                            <option value={1500}>느리게</option>
                                            <option value={800}>보통</option>
                                            <option value={300}>빠르게</option>
                                        </select>
                                    </div>
                                    <button
                                        onClick={handleReset}
                                        className="text-xs text-slate-400 hover:text-slate-600 font-medium underline"
                                    >
                                        ↺ 초기화
                                    </button>
                                </div>
                            </div>

                            {/* 현재 상태 알림 */}
                            <div className={`p-4 rounded-2xl border transition-all ${currentPhaseInfo.bg || 'bg-slate-50'} border-slate-200`}>
                                <div className="flex items-center gap-2 mb-1">
                                    <span className="text-xl">{currentPhaseInfo.icon}</span>
                                    <h3 className={`font-bold text-sm ${currentPhaseInfo.color || 'text-slate-700'}`}>
                                        {currentPhaseInfo.title}
                                    </h3>
                                </div>
                                <p className="text-xs text-slate-600 leading-relaxed pl-7">
                                    {currentPhaseInfo.desc}
                                </p>
                            </div>

                            {/* UCB1 AI 머릿속 모니터 */}
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                                <div className="flex justify-between items-center">
                                    <h2 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                                        🧮 AI의 머릿속 (UCB1 점수 계산기)
                                    </h2>
                                </div>
                                {renderUcbPanel()}
                            </div>
                        </div>
                    </div>

                    {/* 가이드 모달 */}
                    {showGuide && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white max-w-2xl w-full rounded-2xl shadow-2xl p-6 space-y-6 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h2 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                                        📖 MCTS 시뮬레이터 사용 가이드
                                    </h2>
                                    <button 
                                        onClick={() => setShowGuide(false)}
                                        className="text-slate-400 hover:text-slate-600 font-bold text-lg"
                                    >
                                        ✕
                                    </button>
                                </div>

                                <div className="space-y-4 text-sm text-slate-600">
                                    <section className="space-y-2">
                                        <h3 className="font-bold text-slate-800 text-base">🎮 시뮬레이터 조작 방법</h3>
                                        <ul className="list-disc pl-5 space-y-1 text-xs">
                                            <li><b>▶ 1단계씩 실행:</b> 선택 ➔ 확장 ➔ 시뮬레이션 ➔ 역전파의 4단계를 1번 클릭마다 순차 진행합니다.</li>
                                            <li><b>⏩ 자동 탐험:</b> AI가 스스로 무작위 시뮬레이션을 반복하며 트리를 키워나갑니다.</li>
                                            <li><b>속도 조절:</b> 자동 탐험 시 AI의 동작 속도를 변경할 수 있습니다.</li>
                                        </ul>
                                    </section>

                                    <section className="space-y-2">
                                        <h3 className="font-bold text-slate-800 text-base">🔄 MCTS 4단계 기본 개념</h3>
                                        <div className="grid grid-cols-2 gap-2 text-xs">
                                            <div className="p-2.5 bg-blue-50 border border-blue-100 rounded-xl">
                                                <span className="font-bold text-blue-700">1. 선택 (Selection)</span>
                                                <p className="mt-1 text-slate-600">UCB1 점수가 높은 방을 따라 아래로 내려갑니다.</p>
                                            </div>
                                            <div className="p-2.5 bg-amber-50 border border-amber-100 rounded-xl">
                                                <span className="font-bold text-amber-700">2. 확장 (Expansion)</span>
                                                <p className="mt-1 text-slate-600">아직 가보지 않은 새로운 길 하나를 개척합니다.</p>
                                            </div>
                                            <div className="p-2.5 bg-purple-50 border border-purple-100 rounded-xl">
                                                <span className="font-bold text-purple-700">3. 시뮬레이션 (Simulation)</span>
                                                <p className="mt-1 text-slate-600">새 노드에서 끝까지 무작위 가상 대진(보물 찾기)을 돌려봅니다.</p>
                                            </div>
                                            <div className="p-2.5 bg-emerald-50 border border-emerald-100 rounded-xl">
                                                <span className="font-bold text-emerald-700">4. 역전파 (Backpropagation)</span>
                                                <p className="mt-1 text-slate-600">결과(승/패)를 거쳐온 상위 표지판에 기록하며 반영합니다.</p>
                                            </div>
                                        </div>
                                    </section>

                                    <section className="space-y-2">
                                        <h3 className="font-bold text-slate-800 text-base">📐 UCB1 핵심 공식 이해하기</h3>
                                        <p className="text-xs">
                                            UCB1 공식은 <b>"안전한 선택(활용)"</b>과 <b>"새로운 도전(탐색)"</b> 사이의 균형을 맞춥니다.
                                        </p>
                                        <div className="bg-slate-100 p-3 rounded-xl font-mono text-xs text-center border">
                                            UCB1 = 승률(W/N) + c × √( ln(부모방문) / 노드방문 )
                                        </div>
                                        <p className="text-xs text-slate-500">
                                            노드 방문 수(n_i)가 적을수록 우측 가산점 항이 올라가서, 승률이 낮은 방도 오랫동안 안 가면 다시 선택받는 구조를 가집니다.
                                        </p>
                                    </section>
                                </div>

                                <div className="pt-3 border-t flex justify-end">
                                    <button 
                                        onClick={() => setShowGuide(false)}
                                        className="px-5 py-2 bg-slate-900 text-white font-bold rounded-xl text-xs hover:bg-slate-800"
                                    >
                                        닫기
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<Simulator />);
    </script>
</body>
</html>
